[package]
name = "yoshirian"
# Not the app version! The app version lives only in ../package.json (tauri.conf.json points there).
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico", "tiff"] }
tokio = { version = "1", features = ["sync"] }
tar = "0.4.46"
flate2 = "1.1.10"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["deflate"] }
semver = "1.0.28"
sha2 = "0.11.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.20", default-features = false, features = ["deflate", "compress", "util"] }
